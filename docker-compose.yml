services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: uv run --project backend --dev python backend/run.py
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_PATH: /workspace/data/avscout.duckdb
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - .:/workspace
      - backend-venv:/workspace/backend/.venv
      - backend-data:/workspace/data

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    command: npm --workspace frontend run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/node_modules
      - frontend-next:/workspace/frontend/.next

volumes:
  backend-data:
  backend-venv:
  frontend-next:
  frontend-node-modules:
